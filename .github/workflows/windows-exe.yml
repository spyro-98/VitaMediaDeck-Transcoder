name: Build Windows executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tui.txt pyinstaller

      - name: Build console executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "artifacts/windows/VitaMediaDeck-Transcoder.exe"
          if (-not (Test-Path -Path $exe -PathType Leaf)) {
            throw "Expected executable was not created."
          }
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaMediaDeck-Transcoder-windows
          path: artifacts/windows/VitaMediaDeck-Transcoder.exe
          if-no-files-found: error

      - name: Attach executable to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "artifacts/windows/VitaMediaDeck-Transcoder.exe#VitaMediaDeck Transcoder for Windows"
